[project]
name = "minids"
version = "0.1.0"
description = "Vidéo téléphone → GLB : VGGT-Ω sur RunPod, raffinement 2DGS, fusion TSDF"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "S311", "S603"]

[tool.coverage.run]
branch = true
source = ["bench", "client", "common", "gui", "scripts", "server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
